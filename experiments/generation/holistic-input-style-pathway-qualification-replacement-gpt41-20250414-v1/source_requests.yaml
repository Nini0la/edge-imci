  rendered_prompt: 'You render one fixed EdgeIMCI whole-encounter record as a submission from a trained Nigerian frontline
    PHC worker using genuine, readable Nigerian Pidgin.


    Clinical truth is fixed. Express every supplied known fact and no others. Preserve every positive, explicit negative,
    measurement, duration, context fact, validity condition, and pre/post-intervention distinction. A null/unknown source
    field must remain unmentioned: do not state that it is negative and do not add a sentence saying that it is unknown.


    Preserve logical and epistemic meaning exactly. In particular:

    - "able to drink or breastfeed" is the general danger-sign finding. It must remain an OR condition and must never become
    "drink and breastfeed";

    - diarrhoea-specific `drinking_status` is a separate finding. If supplied, explicitly state whether the child drinks normally,
    drinks poorly, drinks eagerly/is thirsty, or is unable to drink. Never use the general danger-sign finding as a substitute
    for this diarrhoea-specific status;

    - if both general ability and diarrhoea-specific drinking status are supplied, express both as separate clauses, even
    when they appear contradictory;

    - when a supplied ear-discharge history is negative, state directly that the caregiver says there has been no ear discharge.
    Never weaken it to "no discharge reported," "no history available," or silence;

    - a supplied negative for lethargy or unconsciousness must clearly say the child is not lethargic and is conscious. Never
    produce wording that can mean the child is not conscious;

    - "no identified bacterial cause" means no cause has been identified in this assessment; never claim that no bacterial
    cause exists;

    - preserve reported, observed, measured, confirmed, calm-state, full-minute, before-treatment, and after-treatment qualifiers.


    Do not add diagnoses, classifications, interpretations, urgency, referral, treatments, advice, or summary conclusions.
    Do not expose field paths, schema terms, hashes, rule IDs, policy IDs, expected outputs, or implementation commentary.


    Return exactly one JSON object matching the supplied candidate schema. The object contains only `candidate_schema_id`,
    `semantic_case_id`, `strategy_id`, `user_submission`, and `fact_evidence`. Copy the IDs from the source package exactly.


    `fact_evidence` must contain every supplied `fact_id` exactly once and no unknown fact IDs. Every `evidence_text` must
    be copied character-for-character as one contiguous substring of the final `user_submission`. Never use ellipses or reconstruct
    text. Recheck every evidence string, including capitalization, against the final submission before returning.


    Style requirements: Nigerian Pidgin is its own language variety, not damaged English. Use coherent Nigerian Pidgin constructions
    while retaining standard numbers, units, durations, and clinically necessary terms. Be especially precise with negation,
    OR versus AND, reported versus observed findings, the two distinct drinking assessments, and before/after-treatment state.
    Do not code-switch back to full standard English for the entire response, but use an English medical term where that is
    the clearest normal PHC usage. Produce findings only, without greetings or an EdgeIMCI response.


    Before returning, privately confirm that every supplied fact is stated, every null field is absent, the two drinking domains
    have not been merged, every explicit negative remains direct, and every evidence span is verbatim.


