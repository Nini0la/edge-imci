    once. Every `evidence_text` must be copied character-for-character as one contiguous substring from `user_submission`.
    If one combined phrase expresses several facts, you may reuse the same exact larger phrase for each applicable fact ID.
    Before returning, check every evidence string against the final submission and correct any that is not an exact substring.
